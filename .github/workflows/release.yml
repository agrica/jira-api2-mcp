# Publishes a version when its tag (vX.Y.Z, e.g. created by `npm version`) is pushed: the package
# goes to GitHub Packages (npm registry) as @agrica/jira-api2-mcp, then a GitHub release records the
# version with its notes and no attached file. The package ships the versioned operation catalog
# (catalog/catalog.json, regenerated locally with catalog:fetch and catalog:build), so that the
# installed server needs no JIRA_CATALOG_PATH. No Jira secret is used here.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      packages: write # publish to npm.pkg.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # registry-url and scope write a user-level .npmrc that reads NODE_AUTH_TOKEN for the
      # @agrica scope; the project .npmrc holds no credential.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@agrica'

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # GitHub Packages only accepts a scope equal to the repository owner; otherwise the
      # upload fails with an opaque 403.
      - name: Check that the package scope matches the repository owner
        run: |
          scope="$(node -p "require('./package.json').name.split('/')[0].replace('@', '')")"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$scope" != "$owner" ]; then
            echo "::error::package scope @$scope does not match repository owner $owner"
            exit 1
          fi

      - run: npm ci
      - run: npm run check

      # package.json is "private" so that a local `npm publish` cannot ship a package built from a
      # local, unchecked catalog. Only this job, which ships the versioned one, lifts it.
      - name: Allow publication of this package
        run: npm pkg delete private

      - name: Pack (clean build, versioned catalog)
        run: npm run package

      # Fails if the catalog is missing or would be refused by the server at startup.
      - name: Check the package (expected files, valid catalog, no secret)
        run: node scripts/check-package.ts agrica-jira-api2-mcp-*.tgz

      # The tarball checked above is the one published. A pre-release (tag containing "-") gets
      # the dist-tag "next", so that `npm install` keeps resolving the latest stable version.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          dist_tag="latest"
          case "$GITHUB_REF_NAME" in *-*) dist_tag="next" ;; esac
          npm publish agrica-jira-api2-mcp-*.tgz --tag "$dist_tag"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "jira-api2-mcp $GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
